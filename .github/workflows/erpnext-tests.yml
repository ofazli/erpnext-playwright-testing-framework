name: ERPNext Playwright Tests

on:
  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  prepare-environment:
    name: Prepare ERPNext Environment
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout testing framework
        uses: actions/checkout@v4

      - name: Clone ERPNext repository
        run: |
          git clone \
            --depth 1 \
            https://github.com/frappe/erpnext.git \
            ../erpnext

      - name: Validate Docker Compose
        run: |
          docker compose \
            -f compose.dev.yaml \
            config

      - name: Start Docker containers
        run: |
          docker compose \
            -f compose.dev.yaml \
            up -d

      - name: Show Docker containers
        run: |
          docker compose \
            -f compose.dev.yaml \
            ps -a

      - name: Wait for ERPNext
        run: |
          for attempt in {1..30}; do
            if curl \
              --fail \
              --silent \
              http://localhost:8000/api/method/ping; then
              echo
              echo "ERPNext is ready."
              exit 0
            fi

            echo "Waiting for ERPNext... Attempt ${attempt}/30"
            sleep 5
          done

          echo "ERPNext failed to become ready."

          docker compose \
            -f compose.dev.yaml \
            ps -a

          docker compose \
            -f compose.dev.yaml \
            logs \
            --no-color

          exit 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        env:
          BASE_URL: http://localhost:8000
          ADMIN_USERNAME: Administrator
          ADMIN_PASSWORD: admin
        run: npx playwright test
